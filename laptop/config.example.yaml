# Конфигурация тулкита. Скопируйте в config.yaml и заполните перед игрой.
# Все параметры соответствуют регламенту финала (ForcAD).

# Адрес проверяющей системы и токен команды (п. 3.4, 4.3)
forcad:
  # Базовый URL проверяющей системы, например http://forcad.example:5000
  base_url: "http://127.0.0.1:5000"
  # Токен команды для заголовка X-Team-Token
  team_token: "PUT_TEAM_TOKEN_HERE"

flags:
  # Формат флага из регламента (п. 4.1): [A-Z0-9]{31}=
  regex: "[A-Z0-9]{31}="
  # Срок жизни флага берётся из ForcAD API автоматически (game_monitor);
  # просроченные флаги не отправляются (иначе ForcAD вернул бы «Flag is too old»)
  lifetime_rounds: 5

submit:
  # Квота (п. 4.4): 200 флагов/с на команду, burst 400
  rate_per_sec: 200
  burst: 400
  # До 100 флагов в одном запросе и до 10 КиБ на тело (п. 4.3)
  max_flags_per_request: 100
  max_body_bytes: 10240
  # Файл-очередь флагов (JSONL): ingest/replay дописывают сюда, сабмиттер читает
  queue_file: "flags.queue.jsonl"
  # Файл дедупа: флаг не отправляется дважды
  state_file: "flags_seen.txt"

analyzer:
  # IP проверяющей системы — трафик с этих адресов считается проверкой, а не атакой (п. 3.4).
  # Можно перечислить несколько.
  checker_ips: []
  # Считать трафиком атак всё входящее на порты сервисов не с чекера.
  service_ports: []
  # Какие события печать в консоль: flags | http | raw | all
  verbosity: all

game:
  # Начало зачётной части (unix epoch) — для расчёта номера раунда.
  # Раунд 60 секунд (п. 2.1). Пример: 1764180000. Пусто/0 — раунды не считаются.
  # Если 0 и доступен ForcAD API — start калибруется автоматически (game_monitor).
  start: 0
  round_len: 60
  # Имя SQLite-базы детектов (общая для ingest и web)
  detections_db: detections.db
  # Наши сервисы на vulnbox: порт -> имя. Нужно для определения атакуемого
  # сервиса в детектах и в веб-интерфейсе.
  services:
    # 8000: "shop"
    # 8001: "chat"
    # 8002: "blog"

# Автопроверка каждого нового детекта на NPC (npc: true в teams.yaml).
# NPC — безопасный полигон: флаги NPC очков не дают (п. 4.7).
# В UI есть живой переключатель (шапка «NPC-автопроба») — гасит автопробу
# без рестарта, например при шумовом шторме; бюджет: ≤10 проб/мин (см.
# game_monitor и adtool/autoprobe.py).
npc_check:
  enabled: true

# Монитор ForcAD API (P2): текущий раунд, флаг-lifetime, статусы чекеров
# вашей команды (SLA-алерты DOWN/MUMBLE/CORRUPT в UI), калибровка game.start,
# просроченные флаги не отправляются («Flag is too old»).
game_monitor:
  enabled: true
  poll_interval: 15      # сек
  # Ваша команда в ForcAD — для SLA-алертов по статусам чекера:
  team_name: "TeamName"  # как на скорборде (или team_id: 5)
  # team_id: 5

# Приём трафика (vulnbox -> ноутбук). По умолчанию слушает только 127.0.0.1.
# Для live-режима (PCAP-over-IP с vulnbox) запустите с --listen-ip 0.0.0.0
# (docker: LISTEN_IP=0.0.0.0) и включите токены, чтобы чужие в игровой сети
# не могли инжектить поддельные pcap в ваш детектор:
ingest:
  # токен для HTTP-upload (:57013/pcap) — заголовок X-Ingest-Token (pull-режим)
  # token: "long-random-string"
  # токен для PCAP-over-IP (:57012) — первые байты потока (pcapstream POIP_TOKEN=)
  # poip_token: "another-long-random-string"

# Retention (P2): БД не растёт бесконечно при сканерном шуме.
retention:
  enabled: true
  interval_sec: 60
  packets_rows: 500000       # максимум строк в packets (старые удаляются)
  variants_rows: 2000
  seen_flags_rows: 50000

