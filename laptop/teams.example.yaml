# Список команд-целей для fast-track реплая.
# Скопируйте в teams.yaml и заполните к зачётному старту (адреса публикуются, п. 3.3).
# НЕ включайте сюда свой vulnbox.
#
# Два варианта записи:
#  - Простые цели: host + port (если у каждой команды один адрес/порт сервиса).
#  - Сервисы: если у команды несколько сервисов на разных портах —
#    ключ services: {имя: порт}; replay переберёт все порты.
#
# NPC обязателен (npc: true): на него автоматически проверяется каждый новый
# детект (флаги NPC очков не дают, п. 4.7 — это безопасный полигон).

teams:
  - name: "npc"
    host: "10.10.0.1"
    services:
      web: 8000
      proto: 8001
    npc: true
  - name: "team-01"
    host: "10.10.1.1"
    port: 8000          # порт по умолчанию (можно опустить, если задан services)
  - name: "team-02"
    host: "10.10.2.1"
    services:
      web: 8000
      api: 8001
  - name: "team-03"     # временно не целимся — просто поставьте disabled
    host: "10.10.3.1"
    port: 8000
    disabled: true
