# Ноутбучная сторона: webui (основной инструмент, host network —
# PCAP-over-IP :57012 и HTTP-приём pcap :57013 прямо на хосте; replay-атаки
# идут с IP ноутбука, п. 3.6), pkappa2 (ретроспектива) и poll-агент.
#
# Подготовка:
#   cp config.example.yaml config.yaml && cp teams.example.yaml teams.yaml
#   (в docker-варианте пути в config.yaml должны быть /app/data/... —
#    см. config.docker.example.yaml)
#
# Запуск (на ноутбуке, из каталога laptop/):
#   docker compose up -d --build                              # webui + pkappa2
#   VULNBOX=root@10.10.1.42 docker compose --profile pull up -d  # + poll-агент
#
# UI: http://127.0.0.1:57020   pkappa2: http://127.0.0.1:2812
services:
  webui:
    build: .
    image: ad-webui:latest
    network_mode: host
    command: >
      python -u web.py
      --config /app/config.yaml --teams /app/teams.yaml
      --with-ingest --with-submitter
      --ingest-dir /app/data/pkappa2-ingest
    environment:
      # сабмиттер реальной отправки требует токен в config.yaml (forcad.team_token);
      # WEB_DRY=1 — dry-режим (флаги помечаются, не отправляются)
      WEB_DRY: ${WEB_DRY:-1}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./teams.yaml:/app/teams.yaml:ro
      - ./data:/app/data
    restart: unless-stopped

  # pkappa2: ретроспективный полнотекстовый поиск по pcap. Готового образа
  # нет — собирается из исходников (profile retro):
  #   git clone https://github.com/spq/pkappa2 ../pkappa2
  #   docker compose --profile retro up -d pkappa2
  pkappa2:
    profiles: ["retro"]
    build: ../pkappa2
    ports:
      - "127.0.0.1:2812:2812"
    volumes:
      - ./data/pkappa2-ingest:/data/pcap
    restart: unless-stopped

  # poll-агент: ноутбук сам забирает pcap с vulnbox по SSH (сценарий 7
  # PLAYBOOK.md — когда vulnbox не может достучаться до ноутбука)
  pull:
    profiles: ["pull"]
    image: alpine:3.20
    network_mode: host
    environment:
      VULNBOX: ${VULNBOX:-}
      INGEST_URL: ${INGEST_URL:-http://127.0.0.1:57013/pcap}
      PULL_INTERVAL: ${PULL_INTERVAL:-10}
    command: >
      sh -c "if [ -z \"$$VULNBOX\" ]; then echo 'VULNBOX не задан
             (VULNBOX=user@vulnbox-ip)'; exit 1; fi;
             apk add --no-cache rsync openssh-client curl >/dev/null &&
             AD_PULL_DIR=/pull-state sh /app/pull.sh
             '$$VULNBOX' '$$INGEST_URL' $${PULL_INTERVAL:-10}"
    volumes:
      - ./pull.sh:/app/pull.sh:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - ./data/pull-state:/pull-state
    restart: unless-stopped
